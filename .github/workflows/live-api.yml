name: Live API check

# Calls the real Parliament APIs through the MCP tools. The main test suite
# mocks HTTP, so it can't see Parliament changing or retiring an endpoint.
on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run live API tests
        env:
          PARLIAMENT_LIVE_TESTS: "1"
        run: pytest tests/live --no-cov -v
