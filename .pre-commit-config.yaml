repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # mypy runs from the project environment (pip install -e ".[dev]") so it can
  # see mcp, httpx, typer and rich; an isolated hook env would lack them.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: python -m mypy src/
        language: system
        types: [python]
        pass_filenames: false
